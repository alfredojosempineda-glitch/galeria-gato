<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Galería Gato"><meta name="description" content="Galería de fotos privada. Tus fotos nunca salen del teléfono.">
<title>Galería Gato</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--txt:#e8eaf0;--mut:#8b90a0;--acc:#6c8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid #222}
h1{font-size:1.2rem;margin:0 12px 0 0}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(26,29,36,.97);border-top:1px solid #2a2e38;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;min-height:52px;background:none;border:0;color:var(--mut);border-radius:12px;cursor:pointer;font-size:.95rem}
.tabs button.on{background:var(--acc);color:#fff}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;box-shadow:0 2px 10px rgba(108,140,255,.4);white-space:nowrap;cursor:pointer;font-size:.95rem}
#status{font-size:.85rem;color:var(--mut);flex-basis:100%}
#bar{height:4px;background:#222;border-radius:4px;overflow:hidden;flex-basis:100%;display:none}#bar div{height:100%;width:0;background:var(--acc);transition:width .2s}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}h1{flex:1}.btn{min-height:44px;display:inline-flex;align-items:center}
#drop{border:2px dashed #333;border-radius:14px;padding:40px 16px;text-align:center;color:var(--mut);margin-bottom:16px}
body.drag #drop{border-color:var(--acc);color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--card);display:block}
.group{background:var(--card);border-radius:14px;padding:12px;margin-bottom:16px}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #333}
.face{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--acc)}
.gh input{background:transparent;border:1px solid transparent;color:var(--txt);font-size:1.05rem;font-weight:600;padding:4px;border-radius:6px;min-width:0}
.gh input:focus{border-color:var(--acc);outline:0}.gh h2{font-size:1.05rem;margin:0}.cnt{color:var(--mut);font-size:.85rem;white-space:nowrap}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:10}
#viewer img{max-width:96vw;max-height:90vh;object-fit:contain}
#viewer button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;font-size:1.6rem;width:48px;height:48px;border-radius:50%;cursor:pointer}
#vx{top:12px;right:12px}#vd{top:12px;left:12px;font-size:1.2rem}.btn2{background:none;color:var(--mut);border:1px solid #333;border-radius:12px;padding:10px 12px;min-height:44px;font-size:.85rem;cursor:pointer}#vp{left:10px}#vn{right:10px}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:4px}}@media(min-width:900px){.tabs{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:420px;border:1px solid #2a2e38;border-radius:14px}}
#ve{bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:auto!important;padding:0 22px;border-radius:24px!important;font-size:1rem!important;background:var(--acc)!important;font-weight:600}
#editor{position:fixed;inset:0;background:#0b0c10;z-index:20;display:none;flex-direction:column}
#editor .top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #222}
#editor .top h2{margin:0;font-size:1.1rem;flex:1}
.ghost{background:none;border:1px solid #333;color:var(--txt);border-radius:12px;min-height:44px;padding:0 14px;font-size:.95rem;cursor:pointer}
.ghost:disabled{opacity:.45}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;min-height:0}
#cmp{position:relative;max-width:100%;max-height:100%}
#cmp canvas{display:block;max-width:100vw;max-height:calc(100dvh - 380px);width:auto;height:auto}
#cmp #eres{position:absolute;inset:0;width:100%;height:100%;background:repeating-conic-gradient(#555 0 25%,#888 0 50%) 0 0/20px 20px}
#div{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 6px #000;transform:translateX(-50%);display:none}
#div::after{content:'⟷';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#111;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.lbl{position:absolute;top:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:8px;font-size:.8rem;display:none}
#ectl{padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;border-top:1px solid #222}
.seg{display:flex;background:#161922;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;color:var(--mut);font-size:.95rem;font-weight:600;cursor:pointer}
.seg button.on{background:#2a3042;color:#fff}
.pane{display:none;flex-direction:column;gap:8px;min-height:118px}.pane.on{display:flex}
.big{min-height:52px;font-size:1.1rem;border-radius:16px;background:linear-gradient(90deg,#6c8cff,#a46cff);color:#fff;border:0;font-weight:700;cursor:pointer}
.big:disabled{opacity:.6}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.sl{color:var(--mut);font-size:.9rem}.sl span{flex:0 0 5.6em}.sl b{flex:0 0 3em;text-align:right;color:var(--txt)}
.sl input{accent-color:var(--acc);height:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{flex:1;min-height:40px;border-radius:20px;border:1px solid #333;background:none;color:var(--txt);font-size:.88rem;cursor:pointer;white-space:nowrap;padding:0 10px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}.chips button:disabled{opacity:.4}
#bgpick{display:none;gap:6px;overflow-x:auto;padding-bottom:2px}#bgpick img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid transparent;flex:0 0 auto}#bgpick img.on{border-color:var(--acc)}
#bgcol{width:44px;height:40px;border:0;background:none;padding:0;flex:0 0 44px;display:none}
#emsg{color:var(--mut);font-size:.85rem;text-align:center;min-height:1.2em}
#ebar{height:4px;background:#222;border-radius:2px;overflow:hidden;display:none}#ebar div{height:100%;width:0;background:var(--acc);transition:width .2s}
</style></head><body>
<header><h1>🐱 Galería Gato</h1>
<button id="clear" class="btn2" hidden>Borrar todo</button><label class="btn">Añadir fotos<input id="file" type="file" accept="image/*" multiple hidden></label>
<div id="bar"><div></div></div><div id="status"></div></header>
<main><div id="drop">Arrastra tus fotos aquí o pulsa «Añadir fotos».<br><small>Todo se procesa en tu navegador; tus fotos no se suben a ningún sitio.</small></div><div id="view"></div></main>
<nav><div class="tabs"><button data-t="all" class="on">Todas</button><button data-t="color">Por color</button><button data-t="face">Por rostro</button></div></nav>
<div id="editor"><div class="top"><button class="ghost" id="eback">← Volver</button><h2>Editar</h2></div>
<div id="stage"><div id="cmp"><canvas id="eorig"></canvas><canvas id="eres"></canvas><div id="div"></div><span class="lbl" style="left:8px" id="lA">Antes</span><span class="lbl" style="right:8px" id="lD">Después</span></div></div>
<div id="ectl"><div id="emsg">Pulsa ✨ Auto para mejorar la foto.</div><div id="ebar"><div></div></div>
<div class="seg" id="etabs"><button data-p="pa" class="on">✨ Auto</button><button data-p="pj">🎚️ Ajustes</button><button data-p="pf">✂️ Fondo</button></div>
<div class="pane on" id="pa"><button id="eauto" class="big">✨ Auto</button>
<label class="row sl"><span>Intensidad</span><input type="range" id="eint" min="0" max="100" value="75" disabled><b id="eintv">75%</b></label></div>
<div class="pane" id="pj"><label class="row sl"><span>Enfoque</span><input type="range" id="esh" min="0" max="100" value="0"><b id="eshv">0</b></label>
<label class="row sl"><span>Grano</span><input type="range" id="egr" min="0" max="100" value="0"><b id="egrv">0</b></label>
<div class="row sl"><span>Tamaño</span><div class="chips" id="egs"><button data-v="0">Fino</button><button data-v="1" class="on">Medio</button><button data-v="2">Grueso</button></div></div></div>
<div class="pane" id="pf"><button id="ebg" class="big">✂️ Quitar fondo</button>
<div class="chips" id="ebgm"><button data-v="t" class="on" disabled>Transparente</button><button data-v="c" disabled>Color</button><button data-v="b" disabled>Desenfocado</button><button data-v="p" disabled>Otra foto</button></div>
<div class="row"><input type="color" id="bgcol" value="#ffffff"><div id="bgpick"></div></div></div>
<div class="row"><button class="ghost" id="esave" disabled>Guardar copia</button><button class="ghost" id="edl" disabled>Descargar</button></div></div></div>
<div id="viewer"><img id="vimg"><button id="vx">×</button><button id="vd" title="Eliminar foto">🗑</button><button id="ve">Editar</button><button id="vp">‹</button><button id="vn">›</button></div>
<script>
const LIB='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js',MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
let photos=[],people=[],tab='all',modelsP=null,queue=Promise.resolve(),pending=0,done=0,skipped=0,curList=[],curIdx=0,usage='';window.__analyzed=0;
const $=s=>document.querySelector(s),st=$('#status');
// ---- IndexedDB ----
let dbP=new Promise((res,rej)=>{const r=indexedDB.open('galeria',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('people',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const d=await dbP;return new Promise((res,rej)=>{const t=d.transaction(store,mode),o=t.objectStore(store);const r=fn(o);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),all=s=>tx(s,'readonly',o=>o.getAll());
const savePhoto=p=>put('photos',{id:p.id,name:p.name,added:p.added,view:p.view,thumbB:p.thumbB,color:p.color,nf:p.nf,faces:p.faces});
const savePerson=p=>put('people',{id:p.id,name:p.name,cover:p.cover});
async function updUsage(){try{const e=await navigator.storage.estimate();usage=` · ${(e.usage/1048576).toFixed(1)} MB usados`}catch(e){usage=''}prog()}
function prog(){const b=$('#bar');$('#clear').hidden=!photos.length;if(pending>done){b.style.display='block';b.firstChild.style.width=(100*done/pending)+'%';st.textContent=`Analizando fotos… ${done}/${pending}`}else{b.style.display='none';st.textContent=photos.length?`${photos.length} fotos · ${people.filter(pp=>personPhotos(pp).length).length} personas${usage}`+(skipped?` · ${skipped} duplicada(s) omitida(s)`:''):''}}
// ---- color ----
function rgb2lab(r,g,b){[r,g,b]=[r,g,b].map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});
let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return[116*y-16,500*(x-y),200*(y-z)]}
function colorInfo(img){const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(img,0,0,48,48);
const d=x.getImageData(0,0,48,48).data,px=[];let sat=0;
for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);sat+=mx?(mx-mn)/mx:0;px.push([r,g,b,rgb2lab(r,g,b)])}
if(!px.length)px.push([0,0,0,rgb2lab(0,0,0)]);sat/=px.length;// k-means k=4 in Lab
let k=4,cen=[0,1,2,3].map(i=>px[Math.floor((i+.5)*px.length/k)][3].slice()),as=new Array(px.length);
for(let it=0;it<8;it++){const s=cen.map(()=>[0,0,0,0]);px.forEach((p,i)=>{let bi=0,bd=1e9;cen.forEach((c,j)=>{const dd=(p[3][0]-c[0])**2+(p[3][1]-c[1])**2+(p[3][2]-c[2])**2;if(dd<bd){bd=dd;bi=j}});as[i]=bi;const q=s[bi];q[0]+=p[3][0];q[1]+=p[3][1];q[2]+=p[3][2];q[3]++});cen=cen.map((c,j)=>s[j][3]?[s[j][0]/s[j][3],s[j][1]/s[j][3],s[j][2]/s[j][3]]:c);}
const cnt=cen.map(()=>[0,0,0,0]);px.forEach((p,i)=>{const q=cnt[as[i]];q[0]+=p[0];q[1]+=p[1];q[2]+=p[2];q[3]++});
// score clusters: size * (1+chroma) so vivid colors win over grey backgrounds
let best=0,bs=-1;cen.forEach((c,j)=>{const ch=Math.hypot(c[1],c[2]),sc=cnt[j][3]*(1+ch/20)*(c[0]<15?.3:1);if(sc>bs){bs=sc;best=j}});
const q=cnt[best],dom=[q[0]/q[3],q[1]/q[3],q[2]/q[3]].map(Math.round);
return{dom,lab:cen[best],cat:category(dom,sat)}}
function category([r,g,b],sat){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510,s=mx?(mx-mn)/mx:0;
if(sat<.08)return'bn';if(s<.18||mx<40){return l<.25?'oscuros':l>.75?'claros':'neutros'}
let h;const dd=mx-mn;if(mx===r)h=((g-b)/dd)%6;else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;h=(h*60+360)%360;
if(h<15||h>=335)return'rojos';if(h<45)return(l<.35&&s<.8?'marrones':'naranjas');if(h<70)return'amarillos';if(h<160)return'verdes';if(h<200)return'cian';if(h<255)return'azules';if(h<290)return'morados';return'rosas'}
const CATS={rojos:['Tonos rojos','#d33'],naranjas:['Cálidos (naranjas)','#e8862a'],marrones:['Tierra y marrones','#8a5a35'],amarillos:['Tonos amarillos','#e6c229'],verdes:['Tonos verdes','#3a9a4a'],cian:['Turquesas','#2bb5b5'],azules:['Tonos azules','#3366dd'],morados:['Morados','#8a4fd0'],rosas:['Rosas','#e05aa8'],bn:['Blanco y negro','linear-gradient(90deg,#fff 50%,#000 50%)'],oscuros:['Oscuros','#222'],claros:['Claros y pastel','#eee'],neutros:['Grises y neutros','#888']};
// ---- faces ----
function loadModels(){if(!modelsP)modelsP=(async()=>{st.textContent='Cargando modelos de reconocimiento facial…';
if(!window.faceapi)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=LIB;sc.onload=res;sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc)});
await faceapi.tf.setBackend('webgl').catch(()=>faceapi.tf.setBackend('cpu'));await faceapi.tf.ready();
await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)])})().catch(e=>{modelsP=null;throw e});return modelsP}
const TH=0.55,dist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-b[i])**2;return Math.sqrt(s)};
const personPhotos=pp=>photos.filter(p=>p.faces&&p.faces.some(f=>f.pid===pp.id));
function assignFace(desc,crop){let best=null,bd=1;for(const p of photos)for(const f of p.faces||[]){if(!f.pid)continue;const d=dist(f.desc,desc);if(d<bd){bd=d;best=f.pid}}
if(best&&bd<TH&&people.some(x=>x.id===best))return best;
const n=people.reduce((m,x)=>Math.max(m,x.num||0),0)+1,pp={id:'p'+Date.now()+Math.random().toString(36).slice(2,6),num:n,name:'Persona '+n,cover:crop};people.push(pp);savePerson(pp);return pp.id}
async function faces(p,img){try{await loadModels()}catch(e){p.faceErr=true;st.textContent='No se pudieron cargar los modelos (¿sin internet?). Los rostros se analizarán la próxima vez.';return}
const c=document.createElement('canvas'),s=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight));c.width=img.naturalWidth*s;c.height=img.naturalHeight*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
const r=await faceapi.detectAllFaces(c,new faceapi.SsdMobilenetv1Options({minConfidence:.5})).withFaceLandmarks().withFaceDescriptors();window.__analyzed++;p.faces=[];
for(const f of r){const b=f.detection.box,m=b.width*.25,cc=document.createElement('canvas');cc.width=cc.height=96;
cc.getContext('2d').drawImage(c,Math.max(0,b.x-m),Math.max(0,b.y-m),b.width+2*m,b.height+2*m,0,0,96,96);
const desc=Array.from(f.descriptor);const box=[b.x/c.width,b.y/c.height,b.width/c.width,b.height/c.height].map(v=>+v.toFixed(4));
p.faces.push({box,desc,pid:null});p.faces[p.faces.length-1].pid=assignFace(desc,cc.toDataURL('image/jpeg',.85))}
p.nf=r.length;c.width=c.height=0}
// ---- import ----
function scaleBlob(img,max,q,png){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(b=>{c.width=c.height=0;r(b)},png?'image/png':'image/jpeg',q))}
function thumbBlob(img,png){const s=Math.min(1,360/Math.min(img.naturalWidth,img.naturalHeight));return scaleBlob(img,Math.max(img.naturalWidth,img.naturalHeight)*s,.8,png)}
function attachURLs(p){p.url=URL.createObjectURL(p.view);p.thumb=URL.createObjectURL(p.thumbB)}
function addFiles(files){files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;$('#drop').style.display='none';skipped=0;pending+=files.length;prog();
for(const f of files){queue=queue.then(async()=>{const id=f.name+'|'+f.size+'|'+f.lastModified;
if(photos.some(p=>p.id===id)){skipped++;done++;prog();return}
try{const src=URL.createObjectURL(f),img=new Image();img.src=src;await img.decode();
const big=Math.max(img.naturalWidth,img.naturalHeight)>2048||f.size>1.5e6||!/jpe?g|png|webp/.test(f.type);
const p={id,name:f.name,added:Date.now(),view:big?await scaleBlob(img,2048,.85):f,thumbB:await thumbBlob(img),color:colorInfo(img)};attachURLs(p);photos.push(p);render();
await faces(p,img);img.src='';URL.revokeObjectURL(src);await savePhoto(p)}catch(e){console.error(e)}done++;prog();render();updUsage()})}}
// retry faces for photos stored while offline
async function retryFaces(){for(const p of photos.filter(p=>p.nf===undefined)){queue=queue.then(async()=>{const img=new Image();img.src=p.url;await img.decode();await faces(p,img);if(p.nf!==undefined)await savePhoto(p);render();prog()})}}
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');addFiles(e.dataTransfer.files)});
// ---- delete ----
async function deletePhoto(p){photos=photos.filter(x=>x!==p);URL.revokeObjectURL(p.url);URL.revokeObjectURL(p.thumb);await del('photos',p.id);
for(const pp of people.slice())if(!personPhotos(pp).length){people=people.filter(x=>x!==pp);await del('people',pp.id)}render();prog();updUsage()}
$('#clear').onclick=async()=>{if(!confirm('¿Borrar TODAS las fotos y personas de la galería? Esta acción no se puede deshacer.'))return;
photos.forEach(p=>{URL.revokeObjectURL(p.url);URL.revokeObjectURL(p.thumb)});photos=[];people=[];await tx('photos','readwrite',o=>o.clear());await tx('people','readwrite',o=>o.clear());$('#drop').style.display='';render();prog();updUsage()};
// ---- render ----
function grid(list){const g=document.createElement('div');g.className='grid';list.forEach((p,i)=>{const im=document.createElement('img');im.src=p.thumb;im.loading='lazy';im.alt=p.name;
